<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The SQL Dossier</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: radial-gradient(circle at top, #2a1f18, #1a120b);
  color: #e8dcc8;
}

textarea {
  width: 100%;
  height: 100%;
  background: #0a0806;
  color: #e8dcc8;
  font-family: monospace;
  border: none;
  outline: none;
  padding: 10px;
  box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
}

button {
  transition: all 0.2s ease;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 10px #ffc107;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  border: 1px solid #3a2a1a;
  padding: 8px;
}

tr:hover {
  background: rgba(255, 193, 7, 0.1);
}

.panel:hover {
  box-shadow: 0 0 10px rgba(255,193,7,0.2);
}

.popup-animate {
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body class="flex h-screen">

<!-- SCORE + TIMER -->
<div style="position:fixed; top:10px; right:20px; text-align:right;">
  <div id="timer">Time: 60</div>
  <div id="score">Score: 0</div>
</div>

<!-- LEFT PANEL -->
<div class="w-1/3 p-6 bg-[#241a11] panel">
  <h1 class="text-2xl text-yellow-400 mb-4" style="text-shadow: 0 0 10px #ffc107;">
    The SQL Dossier
  </h1>

  <h2 class="text-lg mb-2">Case File</h2>

  <p id="caseDescription" class="mb-4"></p>

  <h3 class="text-yellow-400 mb-2">Hint</h3>
  <p id="hintText"></p>
</div>

<!-- RIGHT PANEL -->
<div class="flex-1 flex flex-col p-6 panel">

  <!-- Editor -->
  <div class="flex-1 mb-4 border border-[#3a2a1a] p-4">
    <textarea id="editor">SELECT * FROM transaction_logs;</textarea>
  </div>

  <!-- Buttons -->
  <div class="mb-4">
    <button onclick="runQuery()" 
    class="bg-yellow-500 text-black px-6 py-2 font-bold mr-2">
      Run Query
    </button>

    <button onclick="resetQuery()" 
    class="border border-yellow-500 px-6 py-2">
      Reset
    </button>
  </div>

  <!-- Results -->
  <div class="flex-1 overflow-auto">
    <table id="results"></table>
  </div>

</div>

<script>

// GAME STATE
let currentCase = 1;
let score = 0;
let timeLeft = 60;

// CASES
const cases = {
  1: {
    description: "Find unauthorized access attempts.",
    hint: "Look at action column.",
    solution: rows => rows.some(r => r.action === "UNAUTHORIZED_ACCESS")
  },
  2: {
    description: "Find critical severity logs.",
    hint: "Check severity column.",
    solution: rows => rows.some(r => r.severity === "CRITICAL")
  },
  3: {
    description: "Find encryption bypass event.",
    hint: "Search ENCRYPTION_BYPASS.",
    solution: rows => rows.length === 1 && rows[0].action === "ENCRYPTION_BYPASS"
  }
};

// TIMER
function startTimer() {
  setInterval(() => {
    timeLeft--;
    document.getElementById("timer").innerText = "Time: " + timeLeft;

    if (timeLeft <= 0) {
      alert("⏳ Time's up!");
      saveScore();
      location.reload();
    }
  }, 1000);
}

// RUN QUERY
async function runQuery() {
  const query = document.getElementById("editor").value;

  const res = await fetch("https://sql-dossier.onrender.com/query", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
    },
    body: JSON.stringify({ query }),
  });

  const data = await res.json();

  renderTable(data.rows);
  checkSolution(data.rows);
}

// CHECK SOLUTION
function checkSolution(rows) {
  const current = cases[currentCase];

  if (current.solution(rows)) {
    score += 10;
    document.getElementById("score").innerText = "Score: " + score;

    showPopup("✅ Case " + currentCase + " Solved!");

    currentCase++;

    if (cases[currentCase]) {
      updateCaseUI();
    } else {
      showPopup("🎉 All Cases Solved!");
      saveScore();
    }

  } else {
    showPopup("❌ Wrong query. Try again.");
  }
}

// UPDATE UI
function updateCaseUI() {
  const c = cases[currentCase];
  document.getElementById("caseDescription").innerText = c.description;
  document.getElementById("hintText").innerText = c.hint;
}

// TABLE
function renderTable(rows) {
  const table = document.getElementById("results");
  table.innerHTML = "";

  if (!rows || rows.length === 0) {
    table.innerHTML = "<tr><td>No results</td></tr>";
    return;
  }

  const headers = Object.keys(rows[0]);

  const headerRow = document.createElement("tr");
  headers.forEach(h => {
    const th = document.createElement("th");
    th.innerText = h;
    headerRow.appendChild(th);
  });
  table.appendChild(headerRow);

  rows.forEach(row => {
    const tr = document.createElement("tr");

    headers.forEach(h => {
      const td = document.createElement("td");
      td.innerText = row[h];
      tr.appendChild(td);
    });

    table.appendChild(tr);
  });
}

// RESET
function resetQuery() {
  document.getElementById("editor").value = "";
  document.getElementById("results").innerHTML = "";
}

// POPUP
function showPopup(message) {
  const popup = document.createElement("div");

  popup.innerText = message;
  popup.classList.add("popup-animate");

  popup.style.position = "fixed";
  popup.style.bottom = "20px";
  popup.style.right = "20px";
  popup.style.background = "#ffc107";
  popup.style.color = "#000";
  popup.style.padding = "15px";
  popup.style.fontWeight = "bold";
  popup.style.boxShadow = "0 0 10px rgba(0,0,0,0.5)";

  document.body.appendChild(popup);

  setTimeout(() => popup.remove(), 3000);
}

// SAVE SCORE
function saveScore() {
  localStorage.setItem("score", score);
}

// INIT
window.onload = () => {
  alert("🕵️ Welcome Detective! Solve all cases before time runs out.");
  startTimer();
  updateCaseUI();

  const saved = localStorage.getItem("score");
  if (saved) {
    document.getElementById("score").innerText = "Score: " + saved;
  }
};

</script>

</body>
</html>
