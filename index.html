<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The SQL Dossier</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: #1a120b;
  color: #e8dcc8;
}

textarea {
  width: 100%;
  height: 100%;
  background: #0a0806;
  color: #e8dcc8;
  font-family: monospace;
  border: none;
  outline: none;
  padding: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  border: 1px solid #3a2a1a;
  padding: 8px;
}
</style>
</head>

<body class="flex h-screen">

<!-- LEFT PANEL -->
<div class="w-1/3 p-6 bg-[#241a11]">
  <h1 class="text-2xl text-yellow-400 mb-4">The SQL Dossier</h1>

  <h2 class="text-lg mb-2">Case #402</h2>

  <p class="mb-4">
    At exactly 02:14 AM, suspicious activity was detected.
    Investigate the logs and find anomalies.
  </p>

  <h3 class="text-yellow-400 mb-2">Clues</h3>
  <ul class="text-sm space-y-2">
    <li>Check IP pattern: 192.168.0.x</li>
    <li>Time window: 02:00 - 03:00</li>
  </ul>
</div>

<!-- RIGHT PANEL -->
<div class="flex-1 flex flex-col p-6">

  <!-- Editor -->
  <div class="flex-1 mb-4 border border-[#3a2a1a] p-4">
    <textarea id="editor">SELECT * FROM transaction_logs;</textarea>
  </div>

  <!-- Buttons -->
  <div class="mb-4">
    <button onclick="runQuery()" 
    class="bg-yellow-500 text-black px-6 py-2 font-bold mr-2">
      Run Query
    </button>

    <button onclick="resetQuery()" 
    class="border border-yellow-500 px-6 py-2">
      Reset
    </button>
  </div>

  <!-- Results -->
  <div class="flex-1 overflow-auto">
    <table id="results"></table>
  </div>

</div>

<script>
async function runQuery() {
  const query = document.getElementById("editor").value;

  const res = await fetch("http://localhost:3000/query", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
    },
    body: JSON.stringify({ query }),
  });

  const data = await res.json();

  renderTable(data.rows);
}

function renderTable(rows) {
  const table = document.getElementById("results");
  // CASE SOLUTION CHECK
if (rows && rows.length > 0) {
  const found = rows.some(r => r.action === "UNAUTHORIZED_ACCESS");

  if (found) {
    alert("🕵️ Case Solved! You found the suspicious activity!");
  }
}table.innerHTML = "";

  if (!rows || rows.length === 0) {
    table.innerHTML = "<tr><td>No results</td></tr>";
    return;
  }

  const headers = Object.keys(rows[0]);

  const headerRow = document.createElement("tr");
  headers.forEach(h => {
    const th = document.createElement("th");
    th.innerText = h;
    headerRow.appendChild(th);
  });
  table.appendChild(headerRow);

  rows.forEach(row => {
    const tr = document.createElement("tr");

    headers.forEach(h => {
      const td = document.createElement("td");
      td.innerText = row[h];
      tr.appendChild(td);
    });

    table.appendChild(tr);
  });
}

function resetQuery() {
  document.getElementById("editor").value = "";
  document.getElementById("results").innerHTML = "";
}
</script>

</body>
</html>
